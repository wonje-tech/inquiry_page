<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>학과 상담 시스템</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-page">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="brand">
        <img class="brand-emblem" src="assets/hufs-emblem.svg" alt="한국외국어대학교 엠블럼"/>
        <div class="brand-divider"></div>
        <div class="brand-text">
          <span class="brand-univ">한국외국어대학교</span>
          <span class="brand-dept">AI데이터융합학부</span>
        </div>
      </div>
      <h1>상담 시스템</h1>
      <p>HUFS 계정으로 로그인하세요</p>
    </div>

    <!-- 로그인 전 -->
    <div id="signedOut" hidden>
      <button type="button" class="btn-google" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.6 7l7.2 5.6c4.2-3.9 6.6-9.7 6.6-16.6z"/>
          <path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.2z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        HUFS 계정으로 로그인
      </button>
    </div>

    <!-- 로그인 후 -->
    <div id="signedIn" hidden>
      <div class="who">
        <div class="who-avatar" id="whoAvatar"></div>
        <div class="who-text">
          <div class="who-name"  id="whoName"></div>
          <div class="who-email" id="whoEmail"></div>
        </div>
      </div>
      <button type="button" class="btn-login" id="continueBtn">상담 시작하기</button>
      <button type="button" class="btn-text" id="switchBtn">다른 계정으로 로그인</button>
    </div>

    <div id="loginError" class="error-msg" hidden></div>

    <p class="login-foot">
      한국외국어대학교 구성원(@hufs.ac.kr)이면 누구나 이용할 수 있습니다<br/>
      <a href="admin.html">관리자</a>
    </p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
         getRedirectResult, onAuthStateChanged, signOut }
                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { FIREBASE_CONFIG } from "./js/config.js";
import { HUFS_DOMAIN, isHufsEmail, describeAuthError } from "./js/hufs.js";

// ============================================================
//  로그인 = HUFS Google 계정.
//  아래 도메인 검사는 안내 문구를 위한 것이고, 실제 차단은
//  firestore.rules 의 isHufs() 가 담당한다. 여기를 우회해도 데이터는 나가지 않는다.
// ============================================================

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();
provider.setCustomParameters({ hd: HUFS_DOMAIN, prompt: "select_account" });

const signedOutBox = document.getElementById("signedOut");
const signedInBox  = document.getElementById("signedIn");
const googleBtn    = document.getElementById("googleBtn");
const errEl        = document.getElementById("loginError");

// 팝업이 막힌 환경에서 리디렉션으로 돌아온 경우 처리
getRedirectResult(auth).catch((err) => showError(describeAuthError(err)));

onAuthStateChanged(auth, async (user) => {
  if (!user) { showSignedOut(); return; }

  if (!isHufsEmail(user.email)) {
    await signOut(auth);
    showSignedOut();
    showError(`HUFS 계정(@${HUFS_DOMAIN})으로 로그인해주세요.`);
    return;
  }

  const name = user.displayName || user.email.split("@")[0];
  document.getElementById("whoAvatar").textContent = name.trim().charAt(0) || "H";
  document.getElementById("whoName").textContent   = name;
  document.getElementById("whoEmail").textContent  = user.email;
  signedOutBox.hidden = true;
  signedInBox.hidden  = false;
  errEl.hidden        = true;
});

googleBtn.addEventListener("click", async () => {
  googleBtn.disabled = true;
  errEl.hidden       = true;
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    console.error(err.code || err);
    if (err.code === "auth/popup-blocked") {
      // 팝업 차단 환경(일부 모바일 인앱 브라우저) 대비
      try { await signInWithRedirect(auth, provider); return; }
      catch (e2) { showError(describeAuthError(e2)); }
    } else {
      showError(describeAuthError(err));
    }
  } finally {
    googleBtn.disabled = false;
  }
});

document.getElementById("continueBtn").addEventListener("click", () => {
  location.href = "chat.html";
});

document.getElementById("switchBtn").addEventListener("click", async () => {
  await signOut(auth);
  showSignedOut();
});

function showSignedOut() {
  signedInBox.hidden  = true;
  signedOutBox.hidden = false;
}
function showError(msg) {
  if (!msg) return;
  errEl.textContent = msg;
  errEl.hidden      = false;
}
</script>
</body>
</html>
