<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>관리자 대시보드</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-page">

<!-- 토스트 알림 -->
<div class="toast" id="toast"></div>

<!-- ── 관리자 로그인 ──────────────────────────────── -->
<div class="login-wrap" id="adminLogin">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-mark"></div>
      <h1>관리자 로그인</h1>
      <p>관리자 계정으로 로그인하세요</p>
    </div>

    <form id="adminLoginForm" autocomplete="off">
      <div class="field">
        <label for="adminEmail">이메일</label>
        <input type="email" id="adminEmail" autocomplete="username" placeholder="admin@example.com"/>
      </div>
      <div class="field">
        <label for="adminPw">비밀번호</label>
        <input type="password" id="adminPw" autocomplete="current-password"/>
      </div>
      <div id="adminLoginError" class="error-msg" hidden></div>
      <button type="submit" class="btn-login" id="adminLoginBtn">로그인</button>
    </form>

    <p class="login-foot">학생 상담은 <a href="index.html">상담 시스템</a>에서 이용하세요</p>
  </div>
</div>

<!-- ── 관리자 대시보드 ────────────────────────────── -->
<div class="admin-wrap" id="adminApp" style="display:none">

  <!-- 사이드바: 학생 목록 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">⚙️ 관리자</span>
      <button class="btn-logout" id="logoutBtn">로그아웃</button>
    </div>
    <div class="sidebar-label">질문한 학생</div>
    <ul class="student-list" id="studentList">
      <li class="list-empty">질문한 학생이 없습니다</li>
    </ul>

    <div class="sidebar-tools">
      <!-- 삭제 이력 -->
      <div class="tools-label">삭제 이력</div>
      <div class="reset-status">
        <div class="reset-row">
          <span class="reset-key">마지막 삭제</span>
          <span class="reset-val" id="lastResetVal">기록 없음</span>
        </div>
      </div>

      <!-- 수동 전체 삭제 -->
      <div class="tools-label" style="margin-top:10px">수동 삭제</div>
      <button class="btn-clear-all" id="clearAllBtn">⚠️ 전체 채팅 삭제</button>
    </div>
  </aside>

  <!-- 메인: 채팅 패널 -->
  <div class="admin-chat">
    <header class="chat-header" id="chatHeader">
      <div class="chat-header-info">
        <span class="chat-title">학생을 선택하세요</span>
      </div>
    </header>

    <main class="messages" id="messages">
      <div class="msg-empty" id="msgEmpty">왼쪽에서 학생을 선택하면 대화 내용이 표시됩니다.</div>
    </main>

    <footer class="input-area" id="inputArea" style="display:none">
      <textarea id="msgInput" placeholder="답변을 입력하세요… (Shift+Enter: 줄바꿈)" rows="1" maxlength="1000"></textarea>
      <button class="btn-send" id="sendBtn" disabled>전송</button>
    </footer>
  </div>

</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
                           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
         getDoc, setDoc, getDocs, query, orderBy, onSnapshot, serverTimestamp, Timestamp }
                           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { FIREBASE_CONFIG } from "./js/config.js";

// ============================================================
//  관리자 인증
//  - 이메일/비밀번호 Firebase Auth 계정으로만 로그인한다(익명 로그인 금지).
//  - 관리자 여부는 Firestore 의 admins/{uid} 문서로 판정하며,
//    이 문서는 클라이언트에서 만들 수 없다(보안 규칙 write: false).
//  - 이 화면을 강제로 열더라도 모든 데이터 요청은 보안 규칙에서 다시 검증된다.
//    즉 sessionStorage 같은 클라이언트 값으로는 권한을 얻을 수 없다.
// ============================================================

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

const SETTINGS_REF = doc(db, "settings", "chatReset");

const loginBox  = document.getElementById("adminLogin");
const appBox    = document.getElementById("adminApp");
const loginForm = document.getElementById("adminLoginForm");
const loginBtn  = document.getElementById("adminLoginBtn");
const loginErr  = document.getElementById("adminLoginError");

let selectedThreadId = null;
let unsubMessages    = null;
let unsubThreads     = null;
let adminStarted     = false;

// ── 화면 전환 ──
function showLogin(msg) {
  adminStarted = false;
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }
  if (unsubThreads)  { unsubThreads();  unsubThreads  = null; }
  document.body.className = "login-page";
  appBox.style.display    = "none";
  loginBox.style.display  = "";
  if (msg) showLoginError(msg); else loginErr.hidden = true;
}

function showApp() {
  document.body.className = "admin-page";
  loginBox.style.display  = "none";
  appBox.style.display    = "";
  loginErr.hidden         = true;
}

function showLoginError(msg) {
  loginErr.textContent = msg;
  loginErr.hidden      = false;
}

// ── 로그인 처리 ──
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("adminEmail").value.trim();
  const pw    = document.getElementById("adminPw").value;

  if (!email || !pw) { showLoginError("이메일과 비밀번호를 모두 입력해주세요."); return; }

  loginBtn.disabled    = true;
  loginBtn.textContent = "확인 중...";
  loginErr.hidden      = true;

  try {
    await signInWithEmailAndPassword(auth, email, pw);
    // 관리자 여부 확인은 아래 onAuthStateChanged 에서 이어서 처리한다.
  } catch (err) {
    console.error(err.code || err);
    // 계정 존재 여부가 드러나지 않도록 실패 사유는 하나로 묶어 안내한다.
    showLoginError(
      err.code === "auth/too-many-requests"
        ? "시도가 너무 많습니다. 잠시 후 다시 시도해주세요."
        : "이메일 또는 비밀번호가 올바르지 않습니다."
    );
  } finally {
    document.getElementById("adminPw").value = "";
    loginBtn.disabled    = false;
    loginBtn.textContent = "로그인";
  }
});

// ── 세션 감시 ──
onAuthStateChanged(auth, async (fbUser) => {
  if (!fbUser) { showLogin(); return; }

  // 익명 세션(학생)으로는 관리자 화면에 들어올 수 없다.
  const token = await fbUser.getIdTokenResult();
  if (token.signInProvider !== "password") {
    await signOut(auth);
    return;
  }

  // 관리자 명부 확인 — 서버(보안 규칙)가 인정하는 관리자만 통과한다.
  let adminSnap;
  try {
    adminSnap = await getDoc(doc(db, "admins", fbUser.uid));
  } catch (e) {
    console.error("관리자 확인 실패:", e);
    await signOut(auth);
    showLogin("관리자 권한을 확인하지 못했습니다.");
    return;
  }

  if (!adminSnap.exists()) {
    await signOut(auth);
    showLogin("이 계정에는 관리자 권한이 없습니다.");
    return;
  }

  if (adminStarted) return;
  adminStarted = true;
  showApp();
  await loadLastReset();
  initAdmin();
});

// ──────────────────────────────────────────────
// 마지막 삭제 시각 불러오기 (자동 삭제 없음)
// ──────────────────────────────────────────────
async function loadLastReset() {
  let snap;
  try {
    snap = await getDoc(SETTINGS_REF);
  } catch (e) {
    console.error("settings 읽기 실패:", e);
    return;
  }

  if (!snap.exists() || !snap.data().lastResetAt) {
    document.getElementById("lastResetVal").textContent = "기록 없음";
    return;
  }

  updateResetUI(snap.data().lastResetAt.toMillis());
}

// ── 마지막 삭제 시각 표시 ──
function updateResetUI(lastResetAtMs) {
  if (!lastResetAtMs) {
    document.getElementById("lastResetVal").textContent = "기록 없음";
    return;
  }
  const d = new Date(lastResetAtMs);
  document.getElementById("lastResetVal").textContent =
    d.toLocaleString("ko-KR", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
}

// ──────────────────────────────────────────────
// 학생 목록 실시간 구독
// ──────────────────────────────────────────────
function initAdmin() {
  const q = query(collection(db, "chat_threads"), orderBy("lastMessageAt", "desc"));
  unsubThreads = onSnapshot(q, snap => renderStudentList(snap));
}

function renderStudentList(snap) {
  const list = document.getElementById("studentList");
  list.innerHTML = "";

  if (snap.empty) {
    list.innerHTML = '<li class="list-empty">질문한 학생이 없습니다</li>';
    return;
  }

  snap.forEach(docSnap => {
    const d  = docSnap.data();
    const li = document.createElement("li");
    li.className = `student-item${docSnap.id === selectedThreadId ? " active" : ""}${d.hasUnread ? " unread" : ""}`;
    li.innerHTML = `
      <span class="s-name">${esc(d.studentName)}</span>
      <span class="s-id">${esc(d.studentId)}</span>
      <span class="s-last">${esc(d.lastMessage || "")}</span>`;
    li.addEventListener("click", () => selectThread(docSnap.id, d));
    list.appendChild(li);
  });
}

// ──────────────────────────────────────────────
// 학생 스레드 선택
// ──────────────────────────────────────────────
function selectThread(threadId, data) {
  selectedThreadId = threadId;

  document.getElementById("chatHeader").innerHTML = `
    <div class="chat-header-info">
      <span class="chat-title">${esc(data.studentName)}</span>
      <span class="chat-sub">${esc(data.studentId)}</span>
    </div>`;
  document.getElementById("inputArea").style.display = "flex";

  document.querySelectorAll(".student-item").forEach(el => {
    el.classList.toggle("active", el.querySelector(".s-id")?.textContent === data.studentId);
  });

  if (unsubMessages) unsubMessages();

  const q = query(
    collection(db, "chat_threads", threadId, "messages"),
    orderBy("createdAt", "asc")
  );
  unsubMessages = onSnapshot(q, snap => renderMessages(snap, threadId));
  updateDoc(doc(db, "chat_threads", threadId), { hasUnread: false });
}

// ──────────────────────────────────────────────
// 메시지 렌더링
// ──────────────────────────────────────────────
function renderMessages(snap, threadId) {
  const box   = document.getElementById("messages");
  const empty = document.getElementById("msgEmpty");

  empty.style.display = snap.empty ? "block" : "none";
  box.querySelectorAll(".msg-row").forEach(el => el.remove());

  snap.forEach(msgSnap => {
    const data = msgSnap.data();
    const row  = document.createElement("div");
    row.className = `msg-row ${data.role === "admin" ? "mine" : "theirs"}`;

    const time = data.createdAt?.toDate
      ? data.createdAt.toDate().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" })
      : "";

    if (data.role === "student") {
      row.innerHTML = `
        <div class="msg-avatar">${esc(data.studentName?.[0] || "학")}</div>
        <div class="msg-body">
          <div class="bubble">${esc(data.text)}</div>
          <div class="msg-foot">
            <span class="msg-time">${time}</span>
            <button class="btn-del" data-tid="${threadId}" data-mid="${msgSnap.id}">삭제</button>
          </div>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="msg-body">
          <div class="bubble">${esc(data.text)}</div>
          <div class="msg-foot right">
            <button class="btn-del" data-tid="${threadId}" data-mid="${msgSnap.id}">삭제</button>
            <span class="msg-time">${time}</span>
          </div>
        </div>`;
    }
    box.appendChild(row);
  });

  box.querySelectorAll(".btn-del").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("이 메시지를 삭제할까요?")) return;
      await deleteDoc(doc(db, "chat_threads", btn.dataset.tid, "messages", btn.dataset.mid));
    });
  });

  box.scrollTop = box.scrollHeight;
}

// ──────────────────────────────────────────────
// 답변 전송
// ──────────────────────────────────────────────
const input   = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

input.addEventListener("input", () => {
  autoResize(input);
  sendBtn.disabled = !input.value.trim();
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(); }
});
sendBtn.addEventListener("click", sendReply);

async function sendReply() {
  if (!selectedThreadId) return;
  const text = input.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  input.value = "";
  autoResize(input);

  await addDoc(collection(db, "chat_threads", selectedThreadId, "messages"), {
    text, role: "admin", createdAt: serverTimestamp()
  });
  await updateDoc(doc(db, "chat_threads", selectedThreadId), {
    lastMessage: text.substring(0, 40),
    lastMessageAt: serverTimestamp(),
    hasUnread: false
  });
}

// ──────────────────────────────────────────────
// 스레드 + 메시지 일괄 삭제 헬퍼
// ──────────────────────────────────────────────
async function deleteThread(threadId) {
  const msgsSnap = await getDocs(
    collection(db, "chat_threads", threadId, "messages")
  );
  await Promise.all(msgsSnap.docs.map(m => deleteDoc(m.ref)));
  await deleteDoc(doc(db, "chat_threads", threadId));

  if (selectedThreadId === threadId) {
    selectedThreadId = null;
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    document.getElementById("chatHeader").innerHTML = `
      <div class="chat-header-info">
        <span class="chat-title">학생을 선택하세요</span>
      </div>`;
    document.getElementById("inputArea").style.display = "none";
    document.getElementById("msgEmpty").style.display  = "block";
    document.getElementById("messages").querySelectorAll(".msg-row").forEach(e => e.remove());
  }
}

// ──────────────────────────────────────────────
// 수동 전체 삭제
// ──────────────────────────────────────────────
document.getElementById("clearAllBtn").addEventListener("click", async () => {
  const allSnap = await getDocs(collection(db, "chat_threads"));

  if (allSnap.empty) { alert("삭제할 채팅이 없습니다."); return; }

  if (!confirm(`모든 학생의 채팅 ${allSnap.size}개를 전부 삭제합니다.\n이 작업은 되돌릴 수 없습니다.\n\n계속할까요?`)) return;
  if (!confirm("다시 한번 확인합니다. 전체 채팅을 삭제하시겠습니까?")) return;

  const btn = document.getElementById("clearAllBtn");
  btn.disabled = true;
  btn.textContent = "삭제 중…";

  try {
    await Promise.all(allSnap.docs.map(d => deleteThread(d.id)));
    const now = Date.now();
    await setDoc(SETTINGS_REF, { lastResetAt: Timestamp.fromMillis(now) });
    updateResetUI(now);
    showToast(`전체 채팅 ${allSnap.size}개가 삭제되었습니다.`);
  } catch (e) {
    console.error(e);
    alert("삭제 중 오류가 발생했습니다.");
  } finally {
    btn.disabled = false;
    btn.textContent = "⚠️ 전체 채팅 삭제";
  }
});

// ──────────────────────────────────────────────
// 유틸
// ──────────────────────────────────────────────
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 140) + "px";
}
function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 4000);
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  sessionStorage.clear();
  try { await signOut(auth); } catch (e) { console.error(e); }
  location.href = "index.html";
});
</script>
</body>
</html>
